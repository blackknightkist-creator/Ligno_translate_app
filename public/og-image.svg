<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle glow circles -->
  <circle cx="200" cy="150" r="280" fill="#6366f1" opacity="0.18" filter="blur(60px)" />
  <circle cx="1000" cy="450" r="300" fill="#0ea5e9" opacity="0.15" filter="blur(70px)" />

  <!-- Card Container -->
  <rect x="100" y="80" width="1000" height="470" rx="24" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />

  <!-- Logo Icon -->
  <rect x="160" y="140" width="80" height="80" rx="20" fill="url(#accent)" />
  <path d="M185 180 h30 M200 165 v30 M185 195 h30" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

  <!-- Badge -->
  <rect x="260" y="155" width="220" height="36" rx="18" fill="#4f46e5" fill-opacity="0.25" stroke="#6366f1" stroke-width="1.5" />
  <text x="275" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">SINHALA ↔ ENGLISH</text>

  <!-- Title -->
  <text x="160" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff">LingoPro AI Assistant</text>

  <!-- Subtitle -->
  <text x="160" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#cbd5e1">Bilingual Voice, Singlish Conversion &amp; Executive Email Intelligence</text>

  <!-- Highlights Pills -->
  <g transform="translate(160, 390)">
    <rect x="0" y="0" width="210" height="44" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">🎙️ Hardware STT &amp; TTS</text>

    <rect x="230" y="0" width="220" height="44" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="254" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">✨ Tone Professionalizer</text>

    <rect x="470" y="0" width="190" height="44" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <text x="494" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">🛡️ OWASP ASVS A+</text>
